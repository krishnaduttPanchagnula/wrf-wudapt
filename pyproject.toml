[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrf-digital-twin"
version = "0.1.0"
description = "Generate WRF climate cases from a lat/lon/radius/date and test land-use proposals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "wrf-wudapt contributors"}]
keywords = ["wrf", "climate", "gis", "digital-twin", "urban-planning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "requests>=2.28",
  "PyYAML>=6.0",
  "rasterio>=1.3",
]

[project.optional-dependencies]
test = ["build>=1.0"]

[project.scripts]
wrf-twin = "wrf_digital_twin.cli:main"
wrf-twin-gui = "wrf_digital_twin.gui:main"

[project.urls]
Source = "https://github.com/wrf-wudapt/wrf-wudapt"

[tool.setuptools.packages.find]
include = ["wrf_digital_twin*"]

[tool.setuptools.package-data]
wrf_digital_twin = ["icons/*.png"]
